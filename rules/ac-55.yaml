trigger:
  description: >-
    Прибыль по купленным колам фиксируется продажей фьючерсов против них.
    Условие не проверяется движком — чек-лист сводки при управлении колами.
  implementation: null
action:
  description: >-
    Помнить, что продажа фьючерсов против колов — не завершённая фиксация:
    при полной продаже фьючерсов остаток (колы минус фьючерсы) превращается в
    синтетический пут и на продолжении роста может генерировать убыток.
    Полная фиксация прибыли по колам — закрытие самих колов, в том числе
    синтетически (колл = фьючерс + пут, см. ac-43).
  hintTemplate: null
