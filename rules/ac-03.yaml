id: ac-03
title: ГО непокрытой продажи ×10
character: risk-mode
technique: null
clarity: crisp
scope: open-constructions
status: active
thresholds:
  - name: nakedSaleMarginMultiplier
    value: 10
    unit: ratio
trigger:
  description: >-
    В конструкции присутствует непокрытая продажа волатильности (проданный
    опцион без противоноги в той же конструкции).
  implementation: uncovered-sale-margin
action:
  description: >-
    Помнить, что ГО на непокрытую продажу может в 10 раз превышать ГО на
    покупку того же контракта: на такие стратегии выделяется больше риска и
    обеспечения, а прибыль ограничена премией.
  hintTemplate: >-
    В конструкции есть непокрытая продажа — закладывай обеспечение до ×10 от ГО покупки.
sources:
  - tag: ЛИЧ
    file: "Инструкции/Инвестиции - Ведение опционных позиций.md"
    quotes:
      - '«ГО на непокрутую продажу может в 10 раз превышать ГО на покупку того же кола или пута.»'
      - '«На эти стратегии выделяется больше риска и требуется больше обеспечения.»'
  - tag: ОК
    file: "Обучение/Видео/Илья Коровин. Видео - Опционный клуб.md"
    quotes:
      - '[00:01:30] Почему продажа непокрытых путов безопасна при достаточном обеспечении (стрим 10.07.2025)'
      - '[00:44:22] Маржинальные требования при продаже опционов (стрим 03.07.2025)'
      - '[00:15:53] К чему может привести непокрытая продажа опционов? Риск долга перед брокером (стрим 09.01.2026)'
