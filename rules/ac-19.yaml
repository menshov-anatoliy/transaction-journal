id: ac-19
title: Избыток прибыли и событийные лотерейные опционы
character: profit-protection
technique: null
clarity: fuzzy
scope: open-constructions
status: active
thresholds:
  - name: lotteryExpiryDays
    value: "1-2"
    unit: days
  - name: eventStrangleExpiryDays
    value: "1-3"
    unit: days
trigger:
  description: >-
    Результат обогнал плановую доходность на несколько процентов либо
    ожидается взрывное событие без прогнозирования направления. Доля избытка
    и момент покупки — суждение трейдера.
  implementation: null
action:
  description: >-
    Пустить избыток плановой доходности на дешёвые опционы 1–2 дней
    («лотерейки») или на дешёвые опционы с дальним страйком — с выгодным
    соотношением риск-доходность. При ожидании взрывного события без
    направления — стренгл на 1–3 дня в обе стороны, страйки подальше от
    центра (стоит дешевле).
  hintTemplate: null
sources:
  - tag: ПИ
    file: "Обучение/Лекции/Илья Коровин. Прикрытый интрадей.md"
    quotes:
      - '«Опционы на 1-2 дня стоят на любых рынках очень дёшево и формируют отличное соотношение риск-доходности. Если, например, мы обогнали на несколько процентов нашу плановую доходность, можно пустить эти пару процентов на лотерейки.»'
  - tag: ОК
    file: "Обучение/Видео/Илья Коровин. Видео - Опционный клуб.md"
    quotes:
      - '[00:19:53] Лотерейные опционы перед экспирацией. Берем позицию (стрим 19.06.2025)'
      - '[00:41:29] Истории про лотерейные опционы (стрим 19.06.2025)'
      - '[01:40:13] Что такое "лотерейные опционы" и как их использовать (стрим 10.07.2025)'
  - tag: ИК-БТ
    file: "Обучение/Лекции/Илья Коровин. Базовая Теория.md"
    quotes:
      - '«Большое плечо в опционах достигается малой стоимостью опционах по отношению к возможном дохода. Например, при покупке дешёвых опционов с ближней датой экспирации 1-2 дня (лотерейки) или при покупке дешёвых опционов с дальним страйком или и то, и другое.»'
      - '«Применение. При ожидании в ближайшее время взрывного события без прогнозирования направления движения. Стренгл на 1-2-3 дня, в обе стороны. Стренгл подальше от центра (стоит дешевле).»'
