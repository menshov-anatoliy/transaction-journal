id: ac-05
title: "Портфельная дисциплина: подушка, доли, ребалансировка"
character: risk-mode
technique: null
clarity: crisp
scope: open-constructions
status: active
# Структура личного портфеля вокруг торгового капитала. Дополняет ac-04
# (распределение рискового капитала 10/90) на другом уровне: ac-04 управляет
# капиталом срочного рынка, эта карточка — долями портфеля вокруг него.
thresholds:
  - name: cashCushionShare
    value: 10
    unit: percent
  - name: cashCushionMonths
    value: "3-6"
    unit: months
  - name: baseCryptoShare
    value: 20
    unit: percent
  - name: aggressiveCryptoShare
    value: "35-40"
    unit: percent
  - name: aggressiveRussiaShare
    value: "35-40"
    unit: percent
  - name: rebalanceTimesPerYear
    value: 4
    unit: times-per-year
  - name: rebalanceStep
    value: 5
    unit: percent
  - name: rebalanceMinIntervalMonths
    value: 3
    unit: months
  - name: portfolioReviewYears
    value: 4
    unit: years
trigger:
  description: >-
    Условие не проверяется движком: структура личного портфеля вне журнала.
    Правило — статический чек-лист сводки.
  implementation: null
action:
  description: >-
    Держать подушку наличными 10% портфеля на 3–6 месяцев жизни при
    неблагоприятных событиях. Базовая доля крипты — 20% (внутри 50/50
    BTC/ETH), агрессивная схема — 35–40% крипта, 35–40% РФ-рынок, остаток
    валюта. Ребалансировать вручную 4 раза в год (середины сезонов), шаг не
    менее 5%, не чаще раза в квартал; для усиления эффекта ребалансировки
    увеличивать долю на посадке актива и уменьшать на росте, на локальных
    хаях наращивать валютную долю. Крипто-часть — стейблы на фандинге и
    позиции по монетам в рамках ПИ; ребаланс крипты сверять со скользящими
    средними: цена упала — добирать актив, перекупланность — уменьшать долю.
    Раз в 4 года фиксировать результаты по балансу и ребалансировке.
  hintTemplate: null
sources:
  - tag: Ж
    file: "Обучение/Лекции/Станислав Жупин. Криптоферма 2.0.md"
    quotes:
      - '«10% наличные средства. Эти наличные средства должны покрывать от 3 до 6 месяцев в жизни потребность при наступлении неблагоприятных каких-то. История типа потери работы.»'
      - '«20% в крипте. Предлагает 50 на 50 в биткоин и эфир.»'
      - '«35-40 крипта, 35-40 рос рынок, остальное для диверсификации (валюта).»'
      - '«Предлагает делать ребалансировку 4 раза в год (в середине лета, осени, зимы и весны), оцифровывая все активы вручную.»'
      - '«Шаг ребалансировки не менее 5%, по времени 1 раз в квартал»'
      - '«Чтобы усилить эффект ребалансировки необходимо увеличивать долю на посадке актива и уменьшать долю на его росте.»'
      - '«Криптовалютный портфель может состоять из стейблов, которые будут работать на фандинге и из позиций по конкретным монетам (биток, эфир, солана в РАМКАХ стпатегии ПИ).»'
      - '«Раз в 4 года записываем результаты по балансу и ребалансировки портфеля.»'
      - '«Пример ребалансировки криптоактивов, основываясь на сравнении цены со скользящими средними. Если цена актива упала, добираем этого актива на ребалансировке больше. Если цена наоборот перекуплана, уменьшаем долю актива в портфеле крипты.»'
