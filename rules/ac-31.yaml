id: ac-31
title: Выход из бесперспективной позиции
character: exit
technique: null
clarity: crisp
scope: open-constructions
status: active
thresholds:
  - name: decayWindowDays
    value: 14
    unit: days
trigger:
  description: >-
    До экспирации около двух недель, цена стоит в зоне страйка (актуально для
    квартальных опционов).
  implementation: atm-decay-window
action:
  description: >-
    Закрыть позицию заранее, ограничив убыток: высок риск попасть на активный
    временной распад тетты.
  hintTemplate: >-
    До экспирации {daysLeft} дн., цена в зоне страйка — риск тета-распада, кандидат на досрочный выход.
sources:
  - tag: ПИ
    file: "Обучение/Видео/Илья Коровин. Видео - Прикрытый интрадей.md"
    quotes:
      - '«Если цена на квартальные опционы стоит в зоне страйка и остается около 2-х недель до экспирации, мы рискуем попасть на активный временной распад Тетты. В этом случае целесообразно закрыть позицию, заранее ограничив убыток.»'
  - tag: ПИ
    file: "Обучение/Лекции/Илья Коровин. Прикрытый интрадей.md"
    quotes:
      - '«Поэтому "бояться Тетты" надо только в случае нахождения цены на страйке.»'
