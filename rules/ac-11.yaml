id: ac-11
title: "Колл-спред: продажа колла в точке тейка"
character: entry
technique: null
clarity: fuzzy
scope: open-constructions
status: active
# Сборка колл-спреда: проданный колл ставится там, где по купленному коллу
# уже забирали бы прибыль, — тот же принцип, что у продажи краёв ac-18.
thresholds: []
trigger:
  description: >-
    Правило сборки конструкции на входе: точка тейка — суждение трейдера,
    движку проверять нечего.
  implementation: null
action:
  description: >-
    Собирая колл-спред, покупать колл у текущей цены и продавать колл на
    уровне, где по купленному коллу уже забирал бы прибыль; ниже продавать нет
    смысла — конструкция даёт мало прибыли. Управлять фьючерсом на такой
    конструкции нельзя: купленные опционы компенсируют по рискам проданные,
    а фьючерсная нога остаётся непокрытой (в отличие от стреддла ac-35).
    Пример стрима: ETH 3200 — покупка колла 3200, продажа колла 3700 при
    стоимости конструкции 180 USD и максимальной прибыли 320 USD.
  hintTemplate: null
sources:
  - tag: ИК-КР
    file: "Обучение/Видео/Илья Коровин. Видео - Крипта.md"
    quotes:
      - '«Покупка колла на 3200, продажа колла на 3700. Ниже продавать нет смысла, потому что мало прибыли получим с конструкции.» (заметка стрима 11.12.2025)'
      - '«Логика продажи колла в спреде. Мы продаём колл в той точке, где уже бы забирали прибыль по купленному коллу.» (заметка стрима 11.12.2025)'
      - '«Управлять фьючерсом на такой конструкции нельзя, так как риски по фьючерсам оказываются не прикрыты. Купленные опционы компенсируют по рискам проданные опционы.» (заметка стрима 11.12.2025)'
      - '[00:41:48] Как построить колл-спред: логика выбора страйков и расчет потенциальной прибыли/риска (стрим 11.12.2025)'
      - '[00:53:08] Можно ли управлять колл-спредом с помощью фьючерсов и когда это имеет смысл (стрим 11.12.2025)'
