# Смещённый стреддл с компенсирующей ногой. Пропорция ног бинарна, но
# направление выбирает человек: агент прогнозов не делает (главное правило).
thresholds:
  - name: directionalLegRatio
    value: "4:1"
    unit: ratio
trigger:
  description: >-
    Сборка направленной (смещённой) ставки на входе; направление — решение
    трейдера, движку проверять нечего.
  implementation: null
action:
  description: >-
    Делая направленную ставку, собрать смещённый стреддл: 4 части в сторону
    выбранного направления и 1 часть в противоположную. Противоположная часть
    компенсирует убыток, если направление конструкции оказалось неверным.
  hintTemplate: null
sources:
