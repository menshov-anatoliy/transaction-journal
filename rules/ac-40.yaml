id: ac-40
title: Размораживание залипших частей
character: futures-leg
technique: null
clarity: crisp
scope: open-constructions
status: active
thresholds:
  - name: unfreezeProfitRatio
    value: 2
    unit: ratio
  - name: unfreezeProfitShare
    value: "10-20"
    unit: percent
trigger:
  description: >-
    Рабочая часть залипла: цена не доходит до уровня закрытия или идёт в
    противоположную сторону без откатов, свободных частей не остаётся.
  implementation: unfreeze-profit-ratio
action:
  description: >-
    Право на убыточную сделку по разлипанию даёт только накопленная прибыль —
    общий плюс по залипшим и незалипшим частям. Накопленная прибыль должна быть
    не менее чем в 2 раза больше фиксируемого убытка; обычно достаточно 10–20%
    накопленной прибыли на одну залипшую часть. Разлипать только когда цена вошла
    в новый диапазон флэта и ходит в нём (в тренде — сидеть и наблюдать); по
    одной части за раз, не все сразу. Если цена вернётся к страйку — части
    разлипнутся сами, досрочно невыгодно. Залипшие заявки подтягивать к текущим
    уровням рынка.
  hintTemplate: >-
    Накопленная прибыль {profit} ≥ 2× убытка разморозки {loss} — залипшую часть можно разморозить.
sources:
  - tag: ПИ
    file: "Обучение/Лекции/Илья Коровин. Прикрытый интрадей.md"
    quotes:
      - '«Право на убыточную сделку по разлипанию залипшей рабочей части дает наличие накопленной прибыли - общий плюс по залипшей и не залипшей части (частям).»'
      - '«Накопленная прибыль должна быть не менее чем в 2 раза больше фиксации убытка по размораживанию залипшей рабочей части.»'
      - '«Чаще всего, нам должно быть достаточно 10-20% от накопленной прибыли для размораживания одной залипшей части.»'
      - '«Разлипание частей происходит только в том случае, если цена входит в новый диапазон флета и начинает там ходить.»'
      - '«Сразу все части не разлепляем.»'
  - tag: ПИ
    file: "Обучение/Видео/Илья Коровин. Видео - Прикрытый интрадей.md"
    quotes:
      - '«Это зависит от того, куда пойдёт цена в будущем. Если цена вернётся по направлению к страйку, все части разлипнут сами собой и исполнятся в плюс движением цены. В этом случае не выгодно разлеплять их накопленной прибылью досрочно.»'
