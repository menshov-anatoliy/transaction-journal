id: ac-21
title: Продажа границ для снижения риска
character: risk-reduction
technique: null
clarity: fuzzy
scope: open-constructions
status: active
thresholds: []
trigger:
  description: >-
    Нет веры, что цена выйдет за границы конструкции до конца экспирации;
    нужно уменьшить риск ценой ограничения прибыли. Выбор страйков — суждение
    трейдера (пример ЛИЧ: колл 3300 / пут 2900 для стренгла ETH).
  implementation: null
action:
  description: >-
    Продать колл верхней границы и пут нижней: прибыль ограничивается, если
    цена выйдет за границы, но риски и потенциальные убытки снижаются, если не
    выйдет. Длинный пут или колл можно перевести в спред продажей дальнего
    края.
  hintTemplate: null
sources:
  - tag: ЛИЧ
    file: "Инструкции/Инвестиции - Ведение опционных позиций.md"
    quotes:
      - '«А если бороться за прибыль, то можете продать колл 3300 и пут 2900, если не верите, что цена выйдет за эти границы. Тем самым с одной стороны ограничите прибыль, если цена таки выйдет за эти границы. Но с другой стороны, уменьшите риски и потенциальные убытки, если цена не выйдет.»'
  - tag: ОК
    file: "Обучение/Видео/Илья Коровин. Видео - Опционный клуб.md"
    quotes:
      - '«Чтобы уменьшить риск и ограничить прибыль, пут или колл можно перевести в спред.» (заметка стрима 06.06.2025)'
      - '[00:03:12] Как использовать продажу путов для конвертации рублевого счета в валютный? (стрим 22.08.2025)'
