# Хедж пропорцией 1:1, без дельты 0.5 — простое правило стрима (14.08.2025).
thresholds:
  - name: futuresPerCall
    value: 1
    unit: ratio
trigger:
  description: >-
    Направленная позиция из купленных колов в прибыли или нуждается в фиксации
    частями; фьючерсы продаются против колов порциями. Момент продаж — суждение
    трейдера (импульсы роста, уровни).
  implementation: null
action:
  description: >-
    Управлять колами продажей фьючерсов против них: продавать частями на
    импульсах роста (пример стрима — от 10 купленных колов до 9 проданных
    фьючерсов), последний фьючерс можно оставлять «на экспирацию» при
    неопределённости. Хеджировать из расчёта 1 фьючерс = 1 кол, без дельты
    0.5. Продажа фьючерсов — частичная фиксация; полная — закрытием самих
    колов (ac-55).
