id: ac-30
title: Ролл убыточной позиции
character: rolling
technique: null
clarity: fuzzy
scope: open-constructions
status: active
# Канон «никогда не закрывать убыточные сделки» реализуется роллированием:
# ролл — способ не закрывать убыток (уточнение карты характеров #23).
thresholds: []
trigger:
  description: >-
    По текущей конструкции зафиксирован убыток, и трейдер продолжает борьбу за
    прибыль. Параметры новой позиции (объём, плановая прибыль) — расчёт
    трейдера.
  implementation: null
action:
  description: >-
    Не закрывать убыток, а роллировать на следующие контракты, сохраняя
    направление: пересобирать конструкцию, каждый раз улучшая цену входа и
    горизонт экспирации. Цель нового цикла — покрыть убыток старой позиции и
    получить прибыль новой, укладываясь в плановую годовую доходность. Способы:
    увеличить объём новой позиции (агрессивный) или сохранить объём с большей
    плановой прибылью (консервативный — новичкам).
  hintTemplate: null
sources:
  - tag: ПИ
    file: "Обучение/Лекции/Илья Коровин. Прикрытый интрадей.md"
    quotes:
      - '«Роллирование - это инструмент управления убыточной позицией. Мы пересобираем конструкцию, каждый раз улучшая цену входа и горизонт экспирации, чтобы в какой-то момент выйти в плюс и окупить убытки, получить прибыль.»'
  - tag: ПИ
    file: "Обучение/Видео/Илья Коровин. Видео - Прикрытый интрадей.md"
    quotes:
      - '«мы можем либо увеличивать объем открываемой позиции (более агрессивный вариант), либо сохраняя объем позиции, увеличивать плановую прибыль по новой (более консервативный вариант).»'
      - '«Для новичков лучше подходит более консервативный вариант.»'
