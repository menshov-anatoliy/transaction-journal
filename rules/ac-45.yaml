id: ac-45
title: Ступенчатые пары 2:1 при наборе и разборке
character: rebuild-dismantle
technique: synthetic-close
clarity: crisp
scope: open-constructions
status: active
thresholds: []
trigger:
  description: >-
    Условие не проверяется движком: техника набора и разборки применяется
    трейдером при работе с конструкцией. Правило — чек-лист сводки.
  implementation: null
action:
  description: >-
    Синтетический стреддл набирается итерациями «2 CALL купили, 1 FUT продали»
    (или «2 PUT + 1 FUT») до полного объёма. Разбор — в обратном порядке,
    прикрывая риски: «1 FUT купили, 2 CALL продали» — итеративно, чтобы при
    резком движении против позиции не потерять накопленную прибыль.
  hintTemplate: null
