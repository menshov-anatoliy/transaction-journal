    quotes:
      - '«Ступенчатый процесс покупки. 2 CALL купили, 1 FUT продали. Такими итерациями набирается полная необходимая позиция.»'
      - '«Ступенчатый процесс продажи. В обратном порядке, прикрывая риски. 1 FUT купили, 2 CALL продали. Итеративно разбираем всю конструкцию.»'
