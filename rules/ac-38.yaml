id: ac-38
title: Масштабирование во флэте
character: futures-leg
technique: null
clarity: crisp
scope: open-constructions
status: active
thresholds:
  - name: partsUnlockWins
    value: 4
    unit: trades
  - name: limitRaiseWins
    value: 6
    unit: trades
trigger:
  description: >-
    Цена ходит во флэте; в конструкции растёт счёт плюсовых интрадейных сделок.
    Границы флэта определяет трейдер — счёт сделок движок сверяет с заявленной
    фазой.
  implementation: flat-win-streak
action:
  description: >-
    В одном флэте начинать работу одной рабочей частью. От 4 плюсовых сделок и
    более — увеличивать риск на сделку и добавлять рабочие части за счёт
    накопленной прибыли. Более 6 плюсовых — увеличить общий интрадейный лимит.
    После окупаемости стоимости стреддла количество частей может быть больше 5,
    но без незакрытых по рискам фьючерсов (предельные конструкции: 30 опционов
    + 30 фьючерсов, 30 опционов + 0 фьючерсов). Выход из флэта обнуляет все
    изменения лимита — стандартные правила.
  hintTemplate: >-
    {wins} плюсовых сделок во флэте — можно добавить рабочую часть.
sources:
  - tag: ПИ
    file: "Обучение/Лекции/Илья Коровин. Прикрытый интрадей.md"
    quotes:
      - '«В одном флете мы начинаем работать одной рабочей частью.»'
      - '«Чем более уверенный флет, тем больше увеличиваем риск на сделку.»'
      - '«По мере наработки плюса можем дополнительно увеличить общий интрадейный лимит.»'
      - '«Предельные, закрытые по рискам конструкции: - 30 опционов + 30 фьючерсов - 30 опционов + 0 фьючерсов»'
      - '«Как только вышли из флета - все изменения лимита обнулились, вернули стандартные правила.»'
