id: ac-43
title: Формулы синтетического закрытия CALL/PUT
character: rebuild-dismantle
technique: synthetic-close
clarity: crisp
scope: open-constructions
status: active
thresholds: []
trigger:
  description: >-
    Разбирается купленный опцион в деньгах, для которого продажа в рынок
    затруднена.
  implementation: synthetic-close-itm
action:
  description: >-
    CALL в деньгах: внутреннюю стоимость забрать продажей фьючерса, временную —
    продажей PUT того же страйка и экспирации. PUT в деньгах: внутреннюю
    стоимость забрать покупкой фьючерса, временную — продажей CALL того же
    страйка и экспирации. Страйк и экспирация закрывающих ног совпадают с
    закрываемым опционом.
  hintTemplate: >-
    Опцион в деньгах — синтетическое закрытие: FUT + встречный опцион того же страйка и экспирации.
sources:
  - tag: ЛИЧ
    file: "Инструкции/Инвестиции - Ведение опционных позиций.md"
    quotes:
      - '«Внутреннюю стоимость забираем продажей фьючерса, временную стоимость забираем продажей PUT того же страйка и экспирации.»'
      - '«Внутреннюю стоимость забираем покупкой фьючерса, временную стоимость забираем продажей CALL того же страйка и экспирации.»'
  - tag: ОК
    file: "Обучение/Видео/Илья Коровин. Видео - Опционный клуб.md"
    quotes:
      - '«Синтетической закрытие опциона CALL: внутреннюю стоимость забираем продажей фьючерса, временную стоимость забираем продажей PUT того же страйка и экспирации.» (заметка стрима 02.10.2025)'
      - '«Синтетической закрытие опциона PUT: внутреннюю стоимость забираем покупкой фьючерса, временную стоимость забираем продажей CALL того же страйка и экспирации.» (заметка стрима 02.10.2025)'
      - '«Не факт, что на всех инструментах будет сложно продать колл или пут, который глубоко в деньгах. На крипте хорошая ликвидность.» (заметка стрима 02.10.2025)'
      - '[03:10:09] Почему при синтетическом закрытии нужно использовать одинаковые страйки (стрим 05.09.2025)'
      - '[01:17:55] Как быстро закрыть опционную позицию через синтетику (стрим 09.10.2025)'
      - '[01:20:19] Как полностью закрыть прибыльную конструкцию через синтетику перед экспирацией (стрим 22.01.2026)'
  - tag: ИК-БТ
    file: "Обучение/Лекции/Илья Коровин. Базовая Теория.md"
    quotes:
      - '«Продать опцион в деньгах очень сложно. Он становится похож на фьючерс и теряется всякий смысл в его покупке для контрагента. Ликвидности в таком инструменте нет, она вся сосредоточена в опционах на деньгах и вне денег.»'
      - '«Для продажи такого опциона используется синтетика - продажей фьючерса забирается внутренняя стоимость, а продажей PUT - временная стоимость.»'
