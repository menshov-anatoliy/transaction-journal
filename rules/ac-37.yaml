id: ac-37
title: Дисциплина заявок
character: futures-leg
technique: null
clarity: crisp
scope: open-constructions
status: active
thresholds: []
trigger:
  description: >-
    Условие не проверяется движком: заявки выставляются в терминале вне
    журнала. Правило — чек-лист сводки при работе интрадеем.
  implementation: null
action:
  description: >-
    Торговать только лимитными заявками; ставить заявки перед большим объёмом в
    стакане; избегать круглых цифр. При возникновении коридора цены, который
    формирует движение меньше заранее определённой прибыли на сделку, не
    запрещено сделать сделку на границе этого коридора.
  hintTemplate: null
