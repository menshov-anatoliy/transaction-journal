id: ac-07
title: Усреднение направленной позиции
character: entry
technique: null
clarity: fuzzy
scope: open-constructions
status: active
thresholds: []
trigger:
  description: >-
    Открыта направленная опционная позиция; цена идёт против позиции или
    откатывает от уровней докупок. Страйки усреднения задаются трейдером при
    сборке — движку проверять нечего.
  implementation: null
action:
  description: >-
    Докупать равными частями по заранее определённым страйкам усреднения; когда
    цена сдвигается вверх от докупок — каждый раз частично забирать норму
    прибыли, зарабатывая контр-трендом от центрального страйка; истекающие
    опционы роллировать на новый срок по текущему страйку.
  hintTemplate: null
sources:
  - tag: ЛИЧ
    file: "Инструкции/Инвестиции - Ведение опционных позиций.md"
    quotes:
      - '«Разбиваем позицию на части, которыми будем усредняться при падении.»'
      - '«Если цена идет против нас, мы докупаем равными частями. Если цена от этих частей сдвигается вверх, мы каждый раз собираем частично свою норму прибыли. По сути, зарабатываем контр-трендом от центрального страйка.»'
      - '«Если опционы начинают истекать, роллируем их на новый срок по текущему страйку.»'
