id: ac-23
title: Дельта-нейтраль перед оффлайном
character: risk-reduction
technique: null
clarity: crisp
scope: open-constructions
status: active
thresholds:
  - name: offlineDaysThreshold
    value: 2
    unit: days
trigger:
  description: >-
    Условие не проверяется движком: план оффлайна трейдера недоступен журналу.
    Правило — чек-лист сводки для периода отсутствия у терминала дольше двух
    дней при сместившемся от центра стреддле.
  implementation: null
action:
  description: >-
    Либо закрыть всю конструкцию при общей прибыли, либо занейтралить дельту.
    Рынок сместился вверх — накопилась положительная дельта, продать фьючерсы;
    сместился вниз — отрицательная, купить фьючерсы. Нейтрализовать дельту
    свободными рабочими частями контр-трендом, не нарушая концепцию ПИ.
  hintTemplate: null
sources:
  - tag: ПИ
    file: "Обучение/Лекции/Илья Коровин. Прикрытый интрадей.md"
    quotes:
      - '«Если период оффлайн больше двух дней, это может негативно отразиться на общем результате.»'
      - '«Если рынок сместился вверх, то у нас накопилась положительная дельта, значит надо продать фьючерсы, чтобы занейтралить её.»'
      - '«Если рынок сместился вниз, то у нас накопилась отрицательная дельта, значит надо купить фьючерсы, чтобы занейтралить её.»'
      - '«Нейтралим дельту свободными рабочими частями контр-трендом, что не нарушает общей концепции ПИ.»'
