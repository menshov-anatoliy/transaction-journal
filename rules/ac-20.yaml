id: ac-20
title: Досрочная фиксация вместо экспирации
character: profit-protection
technique: null
clarity: crisp
scope: open-constructions
status: active
thresholds: []
trigger:
  description: >-
    Опцион даёт необходимую доходность или висит на страйке в последние дни
    перед экспирацией. Порог «необходимой доходности» индивидуален.
  implementation: null
action:
  description: >-
    Продавать досрочно, не дожидаясь экспирации: итоговая прибыль на экспирации
    часто хуже прибыли, которую рынок давал в моменте; распад центральных
    опционов в последние дни может забрать накопленную прибыль.
  hintTemplate: null
sources:
  - tag: ПИ
    file: "Обучение/Лекции/Илья Коровин. Прикрытый интрадей.md"
    quotes:
      - '«Если опцион висит на страйке, в последние дни перед экспирацией распад опционов в центре будет очень большой и он может забрать вашу накопленную прибыль.»'
      - '«Итоговая прибыль на экспирации часто бывает хуже, чем прибыль, которую нам давал рынок в моменте.»'
