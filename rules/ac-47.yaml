id: ac-47
title: Перестройка конструкции только в положительной зоне
character: rebuild-dismantle
technique: null
clarity: crisp
scope: open-constructions
status: active
# Зона перестройки — бинарное условие; выбор из трёх вариантов дальнейших
# действий остаётся за трейдером. Не конфликтует с роллированием убыточных
# позиций (ac-26…ac-30): ролл переносит ту же конструкцию на новый срок,
# перестройка меняет профиль конструкции.
thresholds: []
trigger:
  description: >-
    Конструкция в положительной зоне: перестройка разрешена, в минусовой —
    запрещена. Условие зоны не проверяется движком — чек-лист сводки.
  implementation: null
action:
  description: >-
    Перестраивать конструкцию только в положительной зоне — чтобы вывести её
    в безубыток, уменьшить риск или скорректировать взгляд на торгуемый
    нарратив. После выхода в плюс три варианта: оставить до экспирации,
    закрыть досрочно, перестроить. Примеры: после бурного роста попали во
    флет и не ждём сильного роста — переход в call spread; цена выросла —
    продать call, фиксируя прибыль, удерживая put.
  hintTemplate: null
sources:
  - tag: ИК-БТ
    file: "Обучение/Лекции/Илья Коровин. Базовая Теория.md"
    quotes:
      - '«Перестройка опционный конструкции должна происходить только в положительной зоне.»'
      - '«После выхода в положительную зону опционной конструкции у нас есть 3 варианта дальнейших действий: оставить до экспирации для получения прибыли "по синей линии", досрочное закрытие для получения прибыли "по красной линии", преобразовать (перестроить) конструкцию в зоне прибыли.»'
      - '«Это нужно для того, чтобы: вывести конструкцию в безубыток, уменьшить риск, скорректировать свой взгляд на торгуемый нарратив.»'
      - '«Например, после бурного роста мы попадаем во флет и уже не ждём сильного роста - переходим в call spread.»'
      - '«Вариант разбора стредла. Цена выросла - продаём call, фиксируя прибыль и теперь ожидаем её падение, удерживая put.»'
