trigger:
  description: >-
    Условие не проверяется движком: распределение заявок между ботом и ручной
    работой — организация трейдера; компенсация считается при зафиксированном
    убытке прогнозной сделки. Правило — чек-лист сводки.
  implementation: null
action:
  description: >-
    Первые две заявки вверх и вниз от центра — самая часто исполняемая зона —
    отдавать боту; следующие 3 рабочие части отрабатывать вручную, где решает
