id: ac-49
title: Покрытая продажа опционов под целевую цену актива
character: exit
technique: covered-sale
clarity: fuzzy
scope: open-constructions
status: active
# Две зеркальные механики: продажа путов под покупку актива дешевле и продажа
# коллов под продажу актива дороже; работают, пока цена не пришла в целевую зону.
thresholds: []
trigger:
  description: >-
    Есть целевая цена покупки или продажи актива; проданные опционы открытой
    позицией зарабатывают премию, пока цена не дошла до цели. Целевой страйк
    задаёт трейдер. Покрытие обязательно: продажа коллов — только при наличии
    базового актива в объёме обязательства, продажа путов — только при
    зарезервированных средствах на покупку актива по страйку; без покрытия
    продажа превращается в непокрытый риск ac-03.
  implementation: null
action:
  description: >-
    Хотите купить актив по конкретной цене — продавать путы на него со страйком
    целевой цены, пока цена не опустится до страйка; в момент достижения —
    откупить пут (вернув часть премии) и купить подешевевший актив. Хотите
    продать актив при росте — продавать коллы с целевым страйком; при росте до
    цели — откупить коллы и продать актив на запланированный объём. До цели
    премия от продажи — пассивный доход (пример стрима: ~8% годовых на золоте).
  hintTemplate: null
sources:
  - tag: ОК
    file: "Обучение/Видео/Илья Коровин. Видео - Опционный клуб.md"
    quotes:
      - '«Если мы имеем намерение купить актив по конкретной цене, можно продавать опционы пут на этот актив до тех пор, пока цена не опуститься до целевой цены - до страйка. В момент достижения цену необходимо откупить проданный пут, вернув часть премии следующему владельцу и купить подешевевший актив.» (заметка стрима 06.02.2026)'
      - '«Определяем уровень продажи золота при его росте и начинаем продавать колы с целевым страйком. Если золото выросло до целевого уровня, откупаем колы и продаём золото на запланированный объём.» (заметка стрима 06.02.2026)'
      - '[00:24:18] Как опционы помогают покупать активы дешевле (стрим 03.07.2025)'
      - '[00:33:45] Покрытая продажа коллов: разбор стратегии и ее рисков (стрим 09.10.2025)'
      - '[01:20:48] Как продавать покрытые коллы, если доллары на банковском счете, а не у брокера (стрим 02.10.2025)'
  - tag: ИК-КР
    file: "Обучение/Лекции/Илья Коровин. Крипто-Биржа.md"
    quotes:
      - '«Заработок за ожидание роста (продажа покрытых коллов). Мы получаем стоимость проданных страховок, пока цена не вырастит до страйка и мы не продадим БА со своего баланса по заданной цене.»'
      - '«Заработок на ожидании падения актива (продажа путов). Мы получаем стоимость проданных страховок, пока цена не опускается до страйка и мы не получаем этот актив себе на баланс.»'
      - '«В силу высокой волатильность крипто-рынков, опционные страховки здесь стоят дороже, чем на классических рынках. Поэтому такая стратегия на крипте ещё более привлекательная.»'
  - tag: ИК-КР
    file: "Обучение/Видео/Илья Коровин. Видео - Крипта.md"
    quotes:
      - '«Чтобы безопасно продавать колы по цене выше текущей, нужно иметь сам базовый актив.» (заметка стрима 19.09.2025)'
      - '«Чтобы безопасно продавать путы по цене ниже текущей, нужно иметь деньги на покупку базового актива.» (заметка стрима 19.09.2025)'
      - '[00:35:58] Почему продажа путов на BTC считается покрытой при достаточном капитале (стрим 17.10.2025)'
      - '[01:32:15] Как безопасно продавать пут-опционы, если хочешь купить актив дешевле (стрим 11.12.2025)'
