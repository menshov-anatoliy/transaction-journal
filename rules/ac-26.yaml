id: ac-26
title: Ролл на следующий срок
character: rolling
technique: null
clarity: crisp
scope: open-constructions
status: active
thresholds:
  - name: rollWindowDays
    value: "7-10"
    unit: days
trigger:
  description: >-
    Конструкция сгорает на экспирации без плюса, либо до экспирации осталось
    7–10 дней и рынок стоит возле центра.
  implementation: roll-time-window
action:
  description: >-
    Сгоревшую без плюса конструкцию роллировать на следующий месяц от
    центрального страйка — капитал изначально резервируется на 12 циклов. В
    окне 7–10 дней у центра закрыть старый стреддл досрочно и открыть новый на
    новом уровне: за последние 10% времени центральный опцион теряет 25%
    временной стоимости.
  hintTemplate: >-
    До экспирации {daysLeft} дн., цена у центра — окно ролла (7–10 дн.).
sources:
  - tag: ЛИЧ
    file: "Инструкции/Инвестиции - Ведение опционных позиций.md"
    quotes:
      - '«Если не выходит в плюс и сгорает на экспирацию - роллирую на следующий месяц (поскольку у меня капитала хватает изначально на 12 месяцев).»'
      - '«Причем каждый раз роллирую от центрального страйка.»'
  - tag: ПИ
    file: "Обучение/Лекции/Илья Коровин. Прикрытый интрадей.md"
    quotes:
      - '«Это оправдано, когда до экспирации 7-10 дней, а рынок стоит возле центра.»'
      - '«За последние 10% времени существования центрального опциона он потеряет 25% своей временной стоимости.»'
  - tag: ПИ
    file: "Обучение/Видео/Илья Коровин. Видео - Прикрытый интрадей.md"
    quotes:
      - '«Чтобы уйти от максимальных убытков по стреддл на страйке необходимо за несколько дней до экспирации на следующий контракт.»'
  - tag: ОК
    file: "Обучение/Видео/Илья Коровин. Видео - Опционный клуб.md"
    quotes:
      - '[00:07:16] Что делать, если опционы истекают вне денег: роллирование позиции (стрим 05.09.2025)'
      - '[01:12:09] Что делать, если стрэнгл сгорел полностью: стратегия ролловера (стрим 15.01.2026)'
