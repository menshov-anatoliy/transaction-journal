id: ac-17
title: Закрытие прибыльной ноги
character: profit-protection
technique: null
clarity: crisp
scope: open-constructions
status: active
thresholds:
  - name: profitLegCloseParts
    value: 3
    unit: parts
trigger:
  description: >-
    Одна нога стреддла в прибыли; при сильных движениях рынка накапливленная
    прибыль под риском отката.
  implementation: null
action:
  description: >-
    Закрыть прибыльную ногу тремя частями, дав цене качнуться в обратную
    сторону — шанс вывести вторую ногу в прибыль. При сильных движениях
    закрывать плюсовую ногу фьючерсами. Если во второй ноге почти нет
    временной стоимости и остаток несущественен — оставить её в надежде на
    сильное движение в обратном направлении.
  hintTemplate: null
sources:
  - tag: ПИ
    file: "Обучение/Лекции/Илья Коровин. Прикрытый интрадей.md"
    quotes:
      - '«Прибыльную ногу закрывает тремя частями.»'
      - '«Имеет смысл закрыть прибыльную ногу и дать возможность качнуться цене в другую сторону, давая возможность выйти в прибыль по второй ноге.»'
      - '«Нужно закрывать плюсовую ногу стреддла фьючами. Если во второй ноге уже почти нет временной стоимости и остаток цены не существенный, её можно оставить в надежде на сильное движение в обратном направлении.»'
  - tag: ОК
    file: "Обучение/Видео/Илья Коровин. Видео - Опционный клуб.md"
    quotes:
      - '«Имеет смысл закрыть прибыльную ногу и дать возможность качнуться цене в другую сторону, давая возможность выйти в прибыль по второй ноге.» (заметка стрима 04.02.2025)'
      - '«Прибыльную ногу закрывает тремя частями.» (заметка стрима 04.02.2025)'
      - '«Управление стренглом: закрытие прибыльный ноги (уменьшение риска на 3 000 из 15 000, контр-трендовых покупки, докупка недельный лотереек на падение).» (заметка стрима 30.05.2025)'
