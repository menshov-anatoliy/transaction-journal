id: ac-44
title: Синтетика при дефиците ликвидности
character: rebuild-dismantle
technique: synthetic-close
clarity: crisp
scope: open-constructions
status: active
thresholds: []
trigger:
  description: >-
    Не хватает ликвидности для продажи опционов в деньгах при разборке
    конструкции. Оценка достаточности ликвидности — суждение трейдера.
  implementation: null
action:
  description: >-
    Вне-денежные ноги продавать в рынок по теоретической цене, в-денежные
    закрывать синтетически (ac-43). Пример: конструкция 15 CALL + 15 PUT при
    цене выше центра — 15 PUT спокойно продаются в рынок, а 15 CALL разбираются
    синтетически: продать 15 FUT и ещё 15 PUT. Неудобство — в терминале висят
    три позиции до экспирации. На ликвидной крипте сначала пробовать прямую
    продажу позиции.
  hintTemplate: null
sources:
  - tag: ЛИЧ
    file: "Инструкции/Инвестиции - Ведение опционных позиций.md"
    quotes:
      - '«15 PUT мы спокойно продаём в рынок, а 15 CALL разбираем синтетически - продаём 15 FUT и ещё продаём 15 PUT.»'
      - '«При недостаточной ликвидности разбираем (нейтралим) позицию синтетически.»'
  - tag: ПИ
    file: "Обучение/Видео/Илья Коровин. Видео - Прикрытый интрадей.md"
    quotes:
      - '«Тактика продажи. Если цена находиться выше центра стреддла (CALL в деньгах, PUT вне денег), путы продаются элементарно по теоретической цене, CALL на деньгах всегда менее ликвидны.»'
