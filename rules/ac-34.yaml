# Перестройка живой двухногой конструкции под сформировавшийся тренд.
# Не конфликтует с роллом убыточной позиции ac-30: ролл переносит сгоревшую
# конструкцию на новый срок, здесь управляются ноги живой конструкции —
# тот же водораздел, что у ac-47.
thresholds: []
trigger:
  description: >-
    Направленное движение базового актива сформировалось и стабильно; оценка
    стабильности тренда — суждение трейдера.
  implementation: null
action:
  description: >-
    Закрыть убыточную ногу стреддла/стренгла и прикрыть часть позиции по
