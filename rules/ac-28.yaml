trigger:
  description: >-
    Стреддл в прибыли при сильном смещении рынка: дельта близка к единице,
    временной стоимости почти нет, до экспирации далеко, ПИ свою функцию
    выполнил. Величины «сильного смещения» не оцифрованы.
  implementation: null
action:
  description: >-
    Роллироваться: закрыть текущий стреддл со всеми залипшими частями и открыть
    новый стреддл на текущем страйке. Использовать практически всегда, чтобы не
    упускать прибыль, образовавшуюся при сильном смещении рынка.
  hintTemplate: null
sources:
  - tag: ПИ
    file: "Обучение/Лекции/Илья Коровин. Прикрытый интрадей.md"
    quotes:
      - '«При сильном смещении рынка от центра стреддла, дельта - близка к единице (фактически, имеем направленную фьючерсную позицию), тетты (временной стоимости) почти нет.»'
      - '«Если мы в хорошей прибыли, до экспирации ещё далеко, ПИ свою функцию уже выполнил, тогда можно роллироваться - закрыть текущий стреддл со всеми залипшими частями и открыть новый стреддл на текущем страйке.»'
      - '«Используйте это правило практически всегда, чтобы не упускать прибыль, образовавшуюся при сильном смещении рынка.»'
