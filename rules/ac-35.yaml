id: ac-35
title: "Контр-трендовый интрадей: лимит и рабочие части"
character: futures-leg
technique: null
clarity: crisp
scope: open-constructions
status: active
thresholds:
  - name: minStraddleOptions
    value: 30
    unit: contracts
  - name: minStraddleFutures
    value: 15
    unit: contracts
  - name: intradayLimitShare
    value: "1/3"
    unit: share
  - name: workingParts
    value: 5
    unit: parts
trigger:
  description: >-
    Открыт стреддл; объём конструкции меньше минимальной конфигурации
    прикрытого интрадея.
  implementation: min-straddle-size
action:
  description: >-
    Суть интрадея — контр-трендово забирать прибыль, отыгрывая временной распад
    опционов: при росте цены продаём фьючерсы, при возврате откупаем (и
    наоборот). Минимальный объём стреддла — 30 опционов и 15 фьючерсов;
    интрадейный лимит (1/3 от 15 = 5 фьючерсов) разбивается на 5 рабочих
    частей.
  hintTemplate: >-
    Объём конструкции {opts} опц : {fut} фьюч — ниже минимума 30:15 для интрадея.
sources:
  - tag: ПИ
    file: "Обучение/Лекции/Илья Коровин. Прикрытый интрадей.md"
    quotes:
      - '«Суть интрадея - контр-трендово забирать прибыль, отыгрывая временной распад опционов. При росте цены - продаём фьючерсы, при возврате - откупаем. И наоборот.»'
      - '«Минимальный объем стреддла - 30 опционов - 15 фьючерсов.»'
      - '«Разбиваем интрадейный лимит (1/3 от 15 = 5 фьючерсов) на 5 рабочих частей.»'
