id: ac-36
title: Прибыль на сделку и ответные заявки
character: futures-leg
technique: null
clarity: crisp
scope: open-constructions
status: active
thresholds:
  - name: minTradeProfit
    value: 0.1
    unit: percent
trigger:
  description: >-
    Условие не проверяется движком: выбор тайм-фрейма и ATR вне журнала.
    Правило — чек-лист сводки при настройке интрадея.
  implementation: null
action:
  description: >-
    Прибыль на сделку — начиная от 0.1% с шагом 0.1, по ATR актива за рабочий
    тайм-фрейм (час, день): сколько инструмент ходит в деньгах и процентах.
    Прибыль от каждой сделки плюс-минус одинаковая; ответные заявки забирают
    фиксированное количество пунктов, определяемое тайм-фреймом. Фиксировать
    прибыль не обязательно по возврату цены к центру. ETH-практика: забирать
    25–30 USD на сделку (при росте волатильности 50–60), рабочие части
    +30, +100, +250, +500, +700.
  hintTemplate: null
sources:
  - tag: ПИ
    file: "Обучение/Лекции/Илья Коровин. Прикрытый интрадей.md"
    quotes:
      - '«Начиная от 0.1% с шагом 0.1. Необходимо посмотреть ATR актива (опциона, фьючерса или БА?) за 1 час, 1 день и посмотреть, сколько в деньгах и процентах ходит инструмент за интересующий тайм-фрейм.»'
      - '«Прибыль от каждой сделки должны быть плюс-минус одинаковой. Ответные заявки должны забирать фиксированное количество пунктов, которое определяется выбранный тайм-фреймом.»'
      - '«Для того, чтобы зафиксировать прибыль не обязательно дожидаться, чтобы цена вернулась на центр.»'
  - tag: ПИ
    file: "Обучение/Видео/Илья Коровин. Видео - Прикрытый интрадей.md"
    quotes:
      - '«На эфире Коровин старается забирать рабочими частями 20 - 30 USD.»'
      - '«Прибыль забираем 25 - 30 USD.»'
      - '«Если волатильность возрастает, можно половить и 50 - 60 USD. При успокоения рынка возвращаемся к стандартным значениям - 25 - 30 USD.»'
