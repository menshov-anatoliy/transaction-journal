id: ac-15
title: Небольшая планка и фиксация частями
character: profit-protection
technique: null
clarity: fuzzy
scope: open-constructions
status: active
thresholds: []
trigger:
  description: >-
    Позиция в прибыли; выбирается планка прибыли и порядок фиксации. Величина
    «минимальной прибыли» не универсальна — первая фиксация делается по плану
    на сделку (ETH-практика: 25–30 USD).
  implementation: null
action:
  description: >-
    Держать планку прибыли небольшой: завышенная планка повышает риск не дойти
    до неё и развернуться в убыток. Закрываться по частям: первый раз — по
    достижению минимальной прибыли, затем подстраиваясь под рынок; при сильных
    движениях давать прибыли течь, фиксируя частями.
  hintTemplate: null
sources:
  - tag: ЛИЧ
    file: "Инструкции/Инвестиции - Ведение опционных позиций.md"
    quotes:
      - '«Небольшая планка прибыли повышает вероятность забрать прибыль.»'
      - '«Закрываться по частям. Первый раз - по достижению минимальной прибыли, а затем, подстраиваясь под рынок.»'
  - tag: ПИ
    file: "Обучение/Лекции/Илья Коровин. Прикрытый интрадей.md"
    quotes:
      - '«Для того, чтобы давать прибыли течь при сильных движениях цены, необходимо фиксировать позицию частями, в первый раз по достижению плана на сделку.»'
  - tag: ОК
    file: "Обучение/Видео/Илья Коровин. Видео - Опционный клуб.md"
    quotes:
      - '[00:45:07] Правило для опционщиков: почему не нужно жадничать и фиксировать 20-30% прибыли (стрим 10.11.2025)'
      - '[00:20:06] Почему прибыль нужно фиксировать обязательно? (стрим 23.10.2025)'
      - '[00:38:59] Главное правило: никогда не бери стоп-лосс, но всегда бери прибыль (стрим 04.12.2025)'
