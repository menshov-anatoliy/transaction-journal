id: ac-27
title: Порог ролла ≥ 3% от страйка
character: rolling
technique: null
clarity: crisp
scope: open-constructions
status: active
thresholds:
  - name: rollThreshold
    value: 3
    unit: percent-of-strike
trigger:
  description: >-
    Цена ушла от текущего страйка на 3% и больше против позиции. Если цена на
    страйке или ушла в сторону позиции — триггер не срабатывает.
  implementation: roll-threshold
action:
  description: >-
    Роллироваться: ролл целесообразен и лучше бездействия, когда цена идёт
    назад от страйка. Если цена на страйке или ушла в нашу сторону — чаще всего
    роллирование хуже, чем остаться в позиции.
  hintTemplate: >-
    Цена ушла от страйка на {shiftPct}% (порог 3%) — кандидат на ролл.
sources:
  - tag: ПИ
    file: "Обучение/Лекции/Илья Коровин. Прикрытый интрадей.md"
    quotes:
      - '«Имеет смысл роллироваться, если цена ушла 3% и больше от текущего страйка.»'
      - '«Если цена на страйке или ушла в нашу сторону чаще всего роллирование будет хуже, чем просто остаться в позиции.»'
