id: ac-27
title: Порог ролла ≥ 3% от страйка
character: rolling
technique: null
clarity: crisp
scope: open-constructions
status: active
# Порог «>5% против позиции и достигнут следующий страйк» из стрима ОК 22.01.2026 (дозоринг #40) —
# не канон, остаётся цитатой ниже; канон 3% сохранён решением куратора по разделу
# «Политика конфликтов» rules/README.md.
thresholds:
  - name: rollThreshold
    value: 3
    unit: percent-of-strike
trigger:
  description: >-
    Цена ушла от текущего страйка на 3% и больше против позиции. Если цена на
    страйке или ушла в сторону позиции — триггер не срабатывает.
  implementation: roll-threshold
action:
  description: >-
    Роллироваться: ролл целесообразен и лучше бездействия, когда цена идёт
    назад от страйка. Если цена на страйке или ушла в нашу сторону — чаще всего
    роллирование хуже, чем остаться в позиции.
  hintTemplate: >-
    Цена ушла от страйка на {shiftPct}% (порог 3%) — кандидат на ролл.
sources:
  - tag: ПИ
    file: "Обучение/Лекции/Илья Коровин. Прикрытый интрадей.md"
    quotes:
      - '«Имеет смысл роллироваться, если цена ушла 3% и больше от текущего страйка.»'
      - '«Если цена на страйке или ушла в нашу сторону чаще всего роллирование будет хуже, чем просто остаться в позиции.»'
  - tag: ОК
    file: "Обучение/Видео/Илья Коровин. Видео - Опционный клуб.md"
    quotes:
      - '«Роллирование целесообразно и лучше, чем ничего не делать. Имеет смысл роллироваться, если цена ушла 3% и больше от текущего страйка.» (заметка стрима 16.04.2025)'
      - '«Если цена на страйке или ушла в нашу сторону чаще всего роллирование будет хуже, чем просто остаться в позиции.» (заметка стрима 16.04.2025)'
      # Дозоринг (#40): правило диктовано владельцем по фрагменту; порог 5% не признан
      # вытесняющим канон 3% — свежесть курса уступила устойчивому ядру ПИ+ОК.
      - '[00:33:00] На сколько % против рынка роллировать купленные опционы (стрим 22.01.2026): «Если цена идёт против позиции более чем на 5% и достигает следующего страйка — предлагать роллирование.»'
