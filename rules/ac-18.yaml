id: ac-18
title: Продажа дальних краёв не более 1/3
character: profit-protection
technique: null
clarity: crisp
scope: open-constructions
status: active
thresholds:
  - name: edgeVolumeCap
    value: "1/3"
    unit: share-of-options
  - name: practicalEdgeLots
    value: 5
    unit: contracts-of-10
  - name: edgeSaleParts
    value: 2
    unit: parts
trigger:
  description: >-
    Фиксация части прибыли продажей дальних краёв конструкции. Проданный край
    объёмом более 1/3 всех опционов выводит позицию из закрытого риска.
  implementation: edge-sale-cap
action:
  description: >-
    Продавать дальние края объёмом не более 1/3 всех опционов (10 от
    минимальной конструкции), частично — 5 из 10 возможных — и всегда двумя
    частями, там, где и так забрал бы прибыль. Целесообразно продавать «жирные»
    края, исключая риск потери жира. При взлёте волатильности на сильном
    движении проверять улыбку волатильности: на крипте ожидание выше, но центр
    стреддла приподнимается.
  hintTemplate: >-
    Объём продаваемых краёв превышает 1/3 опционов конструкции — риск выхода из закрытого риска.
sources:
  - tag: ПИ
    file: "Обучение/Лекции/Илья Коровин. Прикрытый интрадей.md"
    quotes:
      - '«Мы можем продать не более 1/3 от общего количества опционов (10 от минимальной конструкции), чтобы остаться в условиях закрытого риска.»'
      - '«Продавайте края частично (5 контрактов от 10 возможных при минимальной конструкции).»'
      - '«Продавайте края там, где бы вы и так забрали прибыль.»'
      - '«Целесообразно продавать жирные края, исключая таким образом риск потери жира.»'
  - tag: ПИ
    file: "Обучение/Видео/Илья Коровин. Видео - Прикрытый интрадей.md"
    quotes:
      - '«Всегда продавать края двумя частями.»'
  - tag: ОК
    file: "Обучение/Видео/Илья Коровин. Видео - Опционный клуб.md"
    quotes:
      - '[00:19:35] Лайфхак: Почему продавать дальние опционы выгоднее при высокой волатильности (на примере серебра и Si) (стрим 18.02.2026)'
      - '[00:49:37] Плюсы и минусы продажи дальних опционов для снижения стоимости стрэддла (стрим 15.01.2026)'
