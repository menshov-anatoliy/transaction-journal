id: ac-39
title: Экспоненциальная сетка на выходе из флэта
character: futures-leg
technique: null
clarity: crisp
scope: open-constructions
status: active
thresholds:
  - name: dayAtrParts
    value: "1-2"
    unit: parts
trigger:
  description: >-
    Условие не проверяется движком: сетка частей генерируется по рыночным
    уровням вне журнала. Правило — чек-лист сводки при расстановке заявок.
  implementation: null
action:
  description: >-
    Рабочие части увеличиваются экспоненциально по объёму и дистанции от центра;
    откупать каждую часть на размер чуть меньше первой. Первые 2 части — плотный
    интрадей у центра, выставлять заранее; 3-я часть — за дневным ATR
    (дневной ATR покрывают 1–2 части); 5-я — как минимум когда цена прошла
    стоимость стреддла, лучше держать её про запас. Брошена 5-я часть, а рынок
    идёт мощным безоткатным движением — ресурса интрадея нет, можно только
    принять решение о закрытии позиции. При большом смещении допустимо бросить
    две части сразу. Лонговую сетку (вниз) располагать размашистее шортовой —
    движения вниз резче.
  hintTemplate: null
sources:
  - tag: ПИ
    file: "Обучение/Лекции/Илья Коровин. Прикрытый интрадей.md"
    quotes:
      - '«Рабочие части увеличиваются экспоненциально, а откупаем обратно каждую часть всегда на размер чуть меньше первой части»'
      - '«Первые 2 рабочие части формируют плотный интрадей, остальные части работают по принципу ожидания сильного движения.»'
      - '«Дневной ATR - 1-2 части. 3-я часть должна быть выставлена за дневным ATR. 5 часть бросается как минимум, когда цена прошла стоимость стрэддла»'
      - '«Если мы бросаем 5-ю часть, а рынок продолжает мощное безоткатное движение дальше, это значит что мы больше не имеем ресурса для интрадея. Дальше - мы можем только принять решение о закрытии позиции.»'
  - tag: ПИ
    file: "Обучение/Видео/Илья Коровин. Видео - Прикрытый интрадей.md"
    quotes:
      - '«Пятую часть кидаем не ниже 4 200 USD и не выше 3 400 USD»'
      - '«Поскольку движения вниз как правило болеерезкие и размашистве, чем наверх имеет смысл лонговую экспоненциально сетку располагать более размашисто, чем верхнюю шортовую.»'
