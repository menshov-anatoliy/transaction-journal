id: ac-48
title: Порядок ступенчатой разборки
character: rebuild-dismantle
technique: null
clarity: crisp
scope: open-constructions
status: active
thresholds:
  - name: dismantlePortion
    value: "2-3"
    unit: contracts
trigger:
  description: >-
    Условие не проверяется движком: разборка выполняется трейдером вручную.
    Правило — чек-лист сводки при фиксации прибыли. На спреды с проданным
    опционом не распространяется: их разбирают в обратном порядке (ac-56).
  implementation: null
action:
  description: >-
    Начинать поэтапную разборку с тех опционов, которые сейчас дороже (в
    деньгах), чтобы минимизировать риск утраты накопленной прибыли: дорогие
    опционы быстрее теряют в стоимости при движении против, вне-денежные стоят
    мало и сильно не потеряют. Продавать порциями по 2–3 опциона с каждой
    стороны поочерёдно.
  hintTemplate: null
sources:
  - tag: ЛИЧ
    file: "Инструкции/Инвестиции - Ведение опционных позиций.md"
    quotes:
      - '«Начинаем поэтапную разборку позиции с тех опционов, которые сейчас дороже, чтобы минимизировать риск утраты накопленной прибыли. Начинаем с опционов в деньгах. Продаём порциями по 2 или 3 опциона с каждой стороны поочередно.»'
      - '«Более дорогие опционы будут быстрее терять в стоимости, если цена пойдёт против них. Опционы вне денег уже стоят мало, поэтому сильно не потеряют, если цена пойдёт против них.»'
  - tag: ИК-КР
    file: "Обучение/Видео/Илья Коровин. Видео - Крипта.md"
    quotes:
      - '[00:31:14] Почему сложные опционные конструкции нужно разбирать частями, а не закрывать по рынку (стрим 16.01.2026)'
