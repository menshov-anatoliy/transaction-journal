id: ac-01
title: Лимиты риска на период
character: risk-mode
technique: null
clarity: crisp
scope: open-constructions
status: active
# Пороги — актуальный курс; старые лимиты (не более 20%/мес, 40%/кв) в корпус не включены.
# Политика конфликтов источников — отдельное решение карты #19.
thresholds:
  - name: weeklyRiskLimit
    value: 1
    unit: percent
  - name: monthlyRiskLimit
    value: 5
    unit: percent
  - name: quarterlyRiskLimit
    value: 10
    unit: percent
trigger:
  description: >-
    Суммарный убыток торговой недели, месяца или квартала приближается к лимиту
    периода (1% / 5% / 10% капитала). На дельта-нейтральных конструкциях
    (стреддл, стренгл, бабочка, кондор) допустим риск до верхней границы 10% на
    квартал, на направленных (колы, путы, спреды) — меньше.
  implementation: risk-limit-period
action:
  description: >-
    Остановить наращивание риска и не открывать новые позиции до конца периода.
  hintTemplate: >-
    Убыток за {period}: {lossPct}% при лимите {limitPct}% — наращивание риска остановить.
sources:
  - tag: ЛИЧ
    file: "Инструкции/Инвестиции - Ведение опционных позиций.md"
    quotes:
      - '«На 1 неделю 1%»'
      - '«На 1 месяц 5% (в старом курсе - не более 20%)»'
      - '«На квартал (3 месяца) 10% (в старом курсе - не более 40%)»'
      - '«На дельта-нейтральные конструкции (стредл, стренгл, бабочка, кондор) риска можно в среднем брать больше (до 10% на квартал), на направленные позиции (колы, путы, спреды) - меньше.»'
