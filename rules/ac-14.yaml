id: ac-14
title: Плановая прибыль достигнута — разборка
character: profit-target
technique: null
clarity: fuzzy
scope: open-constructions
status: active
thresholds: []
trigger:
  description: >-
    Смещение стреддла и интрадейные сделки в сумме принесли плановую прибыль.
    Плановая прибыль считается от нормы прикрытого интрадея (ac-02: 5% в месяц,
    10% за квартал) на выделенный капитал конструкции.
  implementation: profit-target-reached
action:
  description: >-
    Частично или полностью разобрать позицию. После досрочного закрытия можно
    пересобрать позицию и вернуться в рынок или взять паузу до экспирации — оба
    варианта корректны.
  hintTemplate: >-
    Результат конструкции {pnlPct}% — плановая прибыль достигнута, кандидат на разборку.
sources:
  - tag: ПИ
    file: "Обучение/Лекции/Илья Коровин. Прикрытый интрадей.md"
    quotes:
      - '«Если смещение стреддла и все интрадейные сделки в итоге принесли плановую прибыль, в этот момент надо частично или полностью разбирать позицию.»'
      - '«Мы можем пересобрать позицию и вернуться обратно в рынок, а можем дать себе отпуск до экспирации.»'
      - '«Очень часто ПИ приносит не лучшие результаты тем, кто вовремя не фиксирует прибыль.»'
