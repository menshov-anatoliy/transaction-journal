id: ac-62
title: Убытки усреднения добавляются к цели позиции
character: profit-target
technique: null
clarity: crisp
scope: open-constructions
status: active
thresholds: []
trigger:
  description: >-
    Усреднение позиции принесло зафиксированные убытки. Условие не проверяется
    движком — чек-лист сводки.
  implementation: null
action:
  description: >-
    Прибавить накопленные убытки усреднения к плановой цели позиции (нормы
    прибыли — ac-02, разборка по достижению — ac-14): цель должна окупить
    убытки и поверх них забрать плановый профит. Без пересчёта цели разборка
    по плану зафиксирует суммарный минус усреднения.
  hintTemplate: null
sources:
  - tag: ОК
    file: "Обучение/Видео/Илья Коровин. Видео - Опционный клуб.md"
    quotes:
      # Дозоринг (#40): правило диктовано владельцем по фрагменту.
      - '[01:07:29] План действий, если усреднение колами попало в даунтренд (стрим 15.01.2026): «Если усреднение приносит убытки — эти убытки необходимо добавлять к цели позиции, чтобы по итогу окупить и убытки, и забрать плановый профит.»'
