id: ac-62
title: Убытки усреднения учитываются в валовой цели нового цикла
character: profit-target
technique: null
clarity: crisp
scope: open-constructions
status: active
thresholds: []
trigger:
  description: >-
    Усреднение позиции принесло зафиксированные убытки. Условие не проверяется
    движком — чек-лист сводки.
  implementation: null
action:
  description: >-
    Для отдельной валовой цели нового цикла прибавить накопленные убытки
    усреднения к плановой прибыли (нормы — ac-02). Эта цель покрывает убытки
    и плановый профит, но не меняет агрегатную цель ProfitValue конструкции:
    TotalPnL уже учитывает RealizedPnL. Не использовать валовую цель как
    триггер разборки ac-14.
  hintTemplate: null
sources:
  - tag: ОК
    file: "Обучение/Видео/Илья Коровин. Видео - Опционный клуб.md"
    quotes:
      # Дозоринг (#40): правило диктовано владельцем по фрагменту.
      - '[01:07:29] План действий, если усреднение колами попало в даунтренд (стрим 15.01.2026): «Если усреднение приносит убытки — эти убытки необходимо добавлять к цели позиции, чтобы по итогу окупить и убытки, и забрать плановый профит.»'
