  переключение через #variant=A|B|C + плавающая нижняя панель и клавиши ←/→.

  ВЫБРОСНОЙ ПРОТОТИП: одиночный HTML-файл, двойной клик — и работает.
  Не продакшн, без тестов и обработки ошибок. Ответ, который он ищет:
  «как должны выглядеть пять экранов, чтобы пользователь отреагировал
  до написания спеки UI» (тикет #6 карты wayfinder).

  Адаптация: скилл prototype предлагает ?variant= в URL, но прототип
  открывается как file:// — надёжнее hash (#variant=B), поведение то же:
  шарится ссылкой и переживает перезагрузку.

function fmt(n, digits = 2) {
  const s = Math.abs(n).toLocaleString("ru-RU", { minimumFractionDigits: digits, maximumFractionDigits: digits });
  return (n < 0 ? "\u2212" : "") + s;
}
function signCls(n) { return n > 0 ? "pos" : (n < 0 ? "neg" : ""); }
function pnl(n, digits = 2) { return `<span class="${signCls(n)}">${n > 0 ? "+" : ""}${fmt(n, digits)}</span>`; }
function pct(n) { return `<span class="${signCls(n)}">${n > 0 ? "+" : ""}${fmt(n, 1)}%</span>`; }
function tradeSum(t) { // сумма со знаком: продажа даёт плюс, покупка — минус
  const v = t.qty * t.price;
  return t.side === "продажа" ? v : -v;
}
function byId(id) { return CONSTRUCTIONS.find(c => c.id === Number(id)); }
function totalOf(c) { return c.realized + c.unrealized + c.adjustments; }
function pctOf(c) { return totalOf(c) / c.capital * 100; }
function daysBetween(a, b) {
  return Math.round((new Date(b) - new Date(a)) / 86400000);
}
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

function toggleSel(execId) {
  if (state.selected.has(execId)) state.selected.delete(execId);
  else state.selected.add(execId);
  render();
}
function inboxStep(d) {
  state.inboxIndex = Math.max(0, Math.min(INBOX.length - 1, state.inboxIndex + d));

}
function setAdjustStep(n) { state.adjustStep = n; render(); }
function setDetailTab(t) { state.detailTab = t; render(); }
function toggleAll() {

}

/* ================= Переключатель и корневой рендер ================= */

const VARIANTS = [
  { key: "A", name: "Терминал", render: renderA },
  { key: "B", name: "Дашборд", render: renderB },
  { key: "C", name: "Мастер", render: renderC },
];

function variantFromHash() {
  const m = location.hash.match(/variant=([ABC])/);
  return m ? m[1] : "A";
}

function render() {
  const v = VARIANTS.find(v => v.key === state.variant);
  document.getElementById("app").innerHTML = v.render();
  document.getElementById("vlabel").textContent = `Вариант ${state.variant} — ${v.name}`;
}

function setVariant(key) {
  state.variant = key;
  location.hash = `variant=${key}`;
  render();
}

document.getElementById("prev").onclick = () => {
  const i = VARIANTS.findIndex(v => v.key === state.variant);
  setVariant(VARIANTS[(i - 1 + VARIANTS.length) % VARIANTS.length].key);
};
document.getElementById("next").onclick = () => {
  const i = VARIANTS.findIndex(v => v.key === state.variant);
  setVariant(VARIANTS[(i + 1) % VARIANTS.length].key);
};
document.addEventListener("keydown", (e) => {
  if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) return;
  if (e.key === "ArrowLeft") document.getElementById("prev").click();
  if (e.key === "ArrowRight") document.getElementById("next").click();
});
window.addEventListener("hashchange", () => {
  const h = variantFromHash();
  if (h !== state.variant) { state.variant = h; render(); }
});

state.variant = variantFromHash();
render();
</script>
</body>
</html>
